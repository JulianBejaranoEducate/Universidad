<app-header></app-header>

<main class="main-content">
  <div class="content-centered">
    <section class="container">
      <section>
        <section class="card shadow rounded-0">
          <div>
            <h1 class="display-5 fw-bold mb-3 text-center">Lotería</h1>
            <p class="lead text-muted text-center">Juega y descubre tu número ganador</p>
          </div>
        </section><hr>

        <section class="text-center">
          <!-- Parte para la balota -->
          <div class="d-flex justify-content-center gap-3 mb-4">
            <app-balota [valor]="valor1"></app-balota>
            <app-balota [valor]="valor2"></app-balota>
          </div>
          <button class="boton mb-3" (click)="jugar()">Empieza a Jugar</button>
          <p class="mb-4">
            <strong>El numero ganador es:</strong> {{numeroGanador}}
          </p>
        </section>
      </section>
      <hr>
      <section class="card shadow rounded-0">
        <app-par-impar [valor]="suma" (parImpar)="getParImpar($event)" #calculo></app-par-impar>
        <div class="text-center">{{mensaje}}</div>
      </section>
    </section>
  </div>
</main>

<app-footer></app-footer>

<router-outlet/>
