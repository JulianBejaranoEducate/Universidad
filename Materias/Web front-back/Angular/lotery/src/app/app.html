<app-header></app-header>

<main class="main-container fade-in">
  <section class="container">
    <section>
      <section>
        <div class="mb-5">
          <h1 class="display-5 fw-bold mb-3">Lotería</h1>
          <p class="lead text-muted">Juega y descubre tu número ganador</p>
        </div>
      </section>

      <!-- Parte para la balota -->
      <app-balota [valor]="valor1"></app-balota>
      <app-balota [valor]="valor2"></app-balota><br>
      <button class="boton" (click)="jugar()">Empieza a Jugar</button>
      <p>
        <strong>El numero ganador es:</strong> {{numeroGanador}}
      </p>
    </section>
    <hr>
    <section>
      <app-par-impar [valor]="suma" (parImpar)="getParImpar($event)" #calculo></app-par-impar>
      <div>{{mensaje}}</div>
    </section>
  </section>
</main><br>

<app-footer></app-footer>

<router-outlet/>
