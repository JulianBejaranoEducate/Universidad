<main class="container mt-5">
    <section class="card shadow rounded-pill">
        <div class="card-header bg-primary text-white">
            <h2 class="mb-0">{{ editarNota ? 'Editar Nota Direciva *ngFor' : 'Agregar Nota Directiva *ngFor' }}</h2>
        </div>
        <div class="card-body">
            <form class="col-form-label-lg">
                <div class="mb-3 row">
                    <label for="id" class="col-sm-2 col-form-label">ID</label>
                    <div class="col-sm-10">
                        <input #id type="number" id="id" class="form-control" placeholder="Ej: 1" [value]="editarNota?.id || ''">
                    </div>
                </div>

                <div class="mb-3 row">
                    <label for="title" class="col-sm-2 col-form-label">Titulo</label>
                    <div class="col-sm-10">
                        <input #title type="text" id="title" class="form-control" placeholder="Ej: Parcial-WordPress" [value]="editarNota?.title || ''">
                    </div>
                </div>

                <div class="mb-3 row">
                    <label for="nota" class="col-sm-2 col-form-label">Nota</label>
                    <div class="col-sm-10">
                        <input #nota type="number" step="0.1" id="nota" class="form-control" placeholder="Ej: 4.5" [value]="editarNota?.nota || ''">
                    </div>
                </div>

                <div class="mb-3 row">
                    <label for="estado" class="col-sm-2 col-form-label">Estado</label>
                    <div class="col-sm-10">
                        <input #estado type="text" id="estado" class="form-control" placeholder="Ej: Aprobada/Rechazada" [value]="editarNota?.estado || ''">
                    </div>
                </div>

                <div class="text-end">
                    <button *ngIf="!editarNota" type="button" class="btn btn-success"
                        (click)="guardar(+id.value, title.value, +nota.value, estado.value)">
                        Guardar Nota
                    </button>
                    <ng-container *ngIf="editarNota">
                        <button type="button" class="btn btn-primary me-2"
                            (click)="actualizar(+id.value, title.value, +nota.value, estado.value)">
                            Actualizar Nota
                        </button>
                        <button type="button" class="btn btn-secondary" (click)="cancelarEdit()">
                            Cancelar
                        </button>
                    </ng-container>
                </div>
            </form>
        </div>
    </section>
    
    <section class="container mt-4" *ngIf="notas.length > 0">
        <h2>Notas de estudiante</h2>
        <ul class="list-group">
            <li class="list-group-item" *ngFor="let nota of notas">
                <div>
                    <strong># {{nota.id}}:</strong> {{nota.title}}
                    <span class="badge bg-primary ms-2">Nota: {{nota.nota}}</span>
                    <span class="text-muted ms-3">[{{ nota.estado }}]</span>
                </div>
                <div class="mt-2">
                    <button type="button" class="btn btn-sm btn-outline-primary me-2" (click)="startEdit(nota)">
                        <i class="bi bi-pencil"></i> Editar
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-danger" (click)="eliminar(nota.id)">
                        <i>Eliminar</i>
                    </button>
                </div>
            </li>
        </ul>
    </section>
</main>
